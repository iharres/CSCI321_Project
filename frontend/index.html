<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>LEGO Portfolio</h1>


<div id="account-area">

    <!-- Logged out -->
    <button id="login-button">Log In</button>

    <div id="login-dropdown" style="display: none;">

        <h3>Log In</h3>

        <input
            type="text"
            id="login-username"
            placeholder="Username"
        >

        <input
            type="password"
            id="login-password"
            placeholder="Password"
        >

        <button id="submit-login">Log In</button>

        <p id="login-message"></p>

        <hr>

        <h3>Register</h3>

        <input
            type="text"
            id="register-username"
            placeholder="Username"
        >

        <input
            type="password"
            id="register-password"
            placeholder="Password"
        >

        <button id="submit-register">Register</button>

        <p id="register-message"></p>

    </div>

    <!-- Logged in -->
    <div id="user-area" style="display: none;">

        <button id="username-button"></button>

        <div id="user-dropdown" style="display: none;">
            <button id="logout-button">Log Out</button>
        </div>

    </div>

</div>


</header>

<section>
    <h2>Add LEGO Set</h2>


<!-- LEGO Box Scanner -->
<h3>Scan LEGO Box</h3>

<input
    type="file"
    id="lego-image"
    accept="image/*"
>

<button id="scan-image-button">
    Scan Set Number
</button>

<p id="scan-status"></p>


<!-- Set Information -->
<input
    type="text"
    id="set-number"
    placeholder="Set Number"
>

<input
    type="number"
    id="purchase-price"
    placeholder="Purchase Price"
>

<select id="condition">
    <option value="NEW">New / Sealed</option>
    <option value="USED">Built / Used</option>
</select>

<button id="add-set-button">
    Add Set
</button>


</section>

<section class="summary">


<h2>Portfolio Summary</h2>

<p id="total-cost">
    Total Cost: $0
</p>

<p id="current-value">
    Current Value: $0
</p>

<p id="profit">
    Profit: $0
</p>


</section>

<section>


<h2>My Sets</h2>

<div id="lego-container"></div>


</section>
<div id="price-history-modal" class="price-history-modal">

    <div class="price-history-content">

        <button
            id="close-price-history"
            class="close-price-history">
            ×
        </button>

        <h2 id="price-history-title">
            Price History
        </h2>

        <div id="price-history-change">
        </div>

        <div class="history-period-buttons">

            <button
                class="history-period-button"
                data-period="1M">
                1M
            </button>

            <button
                class="history-period-button"
                data-period="3M">
                3M
            </button>

            <button
                class="history-period-button active"
                data-period="6M">
                6M
            </button>

            <button
                class="history-period-button"
                data-period="12M">
                12M
            </button>

        </div>

        <div class="price-chart-container">

            <canvas id="price-history-chart">
            </canvas>

        </div>

        <p id="price-history-message">
        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
